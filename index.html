<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081C43">
  <title>KOUROSH AR | Kourosh Fun Club</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#071735;color:#fff}
    body{background:radial-gradient(circle at 50% 25%,#174b9e 0,#0b295c 42%,#071735 85%);display:flex;flex-direction:column;align-items:center}
    header{text-align:center;padding:24px 12px 8px}h1{font-size:clamp(24px,7vw,35px);margin:8px 0 2px;font-weight:900;letter-spacing:2px;color:#ffcf22}
    .brand{font-size:11px;letter-spacing:3px;color:#ff5ba3;font-weight:700}header p{color:#dbeaff;margin:12px 0 0;font-size:14px;line-height:1.9}
    main{width:min(100%,620px);padding:0 14px 22px;flex:1;display:flex;flex-direction:column;align-items:stretch}
    .viewer{width:100%;height:min(58vh,560px);min-height:340px;background:radial-gradient(ellipse at 50% 55%,#2e67b0 0,#122d60 42%,#071735 75%);border:1px solid #3675c1;border-radius:27px;overflow:hidden;position:relative;box-shadow:0 18px 50px #03091790}
    model-viewer{width:100%;height:100%;--progress-bar-color:#ffcc18;outline:0}
    .hint{position:absolute;top:13px;left:12px;right:12px;display:flex;justify-content:center;pointer-events:none;font-size:12px;color:#e5edfa;opacity:.85}
    button.ar{border:0;border-radius:100px;background:linear-gradient(100deg,#ffe541,#ffb400);color:#082456;font-weight:900;font-size:16px;box-shadow:0 5px 25px #ffca2280;padding:15px 22px;position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;cursor:pointer}
    button.ar:focus-visible{outline:3px solid white;outline-offset:3px}
    .status{text-align:center;color:#c4dfff;margin-top:14px;font-size:13px;line-height:2}
    footer{color:#9bb6da;text-align:center;font-size:11px;padding-bottom:22px;line-height:1.8}strong{color:#ffcf22}
  </style>
</head>
<body>
  <header><div class="brand">KOUROSH FUN CLUB</div><h1>KOUROSH AR</h1><p>کوروش رو به دنیای واقعی خودت دعوت کن! 💛</p></header>
  <main>
    <div class="viewer">
      <div class="hint">برای چرخاندن کوروش، انگشتت رو روی تصویر بکش</div>
      <model-viewer id="kourosh" src="./kourosh.glb" alt="شخصیت سه‌بعدی کوروش فان کلاب" camera-controls touch-action="pan-y" auto-rotate rotation-per-second="12deg" interaction-prompt="none" shadow-intensity="1" shadow-softness="0.8" exposure="1.1" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto" scale="0.65 0.65 0.65" camera-orbit="0deg 80deg auto" min-camera-orbit="auto 30deg auto" max-camera-orbit="auto 110deg auto">
        <button class="ar" slot="ar-button" aria-label="دیدن کوروش در محیط واقعی">📱 دیدن کوروش در محیط واقعی</button>
      </model-viewer>
    </div>
    <div id="status" class="status">با گوشی سازگار، روی دکمه زرد بزن و زمین رو اسکن کن.</div>
  </main>
  <footer>نسخه آزمایشی 0.1 — KOUROSH FUN CLUB<br>نیازمند اینترنت و دستگاه سازگار با واقعیت افزوده</footer>
  <script>
    const mv=document.querySelector('#kourosh'),status=document.querySelector('#status');
    mv.addEventListener('error',()=>status.textContent='مدل بارگذاری نشد. اتصال اینترنت و وجود فایل kourosh.glb را بررسی کن.');
    mv.addEventListener('load',()=>{if(!mv.canActivateAR)status.textContent='مدل سه‌بعدی آماده است؛ دکمه AR فقط روی گوشی و مرورگر سازگار دیده می‌شود.'});
    mv.addEventListener('ar-status',e=>{if(e.detail.status==='failed')status.textContent='AR اجرا نشد. Chrome اندروید یا Safari آیفون و پشتیبانی دستگاه از AR را بررسی کن.'});
  </script>
</body>
</html>
